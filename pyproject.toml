[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backward-heat"
version = "1.0.0"
description = "Reproduction of Nguyen (2015): Fourier-truncation regularization of the 2-D backward heat equation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.1", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "sympy>=1.12", "nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
